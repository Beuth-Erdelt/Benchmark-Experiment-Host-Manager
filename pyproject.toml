[build-system]
# setuptools 77 reads the licence as an SPDX expression (PEP 639)
requires        = ["setuptools>=77", "wheel"]
build-backend   = "setuptools.build_meta"

[project]
name            = "bexhoma"
dynamic         = ["version", "dependencies"]
description     = "This python tools helps managing DBMS benchmarking experiments in a Kubernetes-based HPC cluster environment. It enables users to configure hardware / software setups for easily repeating tests over varying configurations."
readme          = { file = "README.md", content-type = "text/markdown" }
license         = "AGPL-3.0-or-later"
license-files   = ["LICENSE"]
requires-python = ">=3.10.2"
authors         = [
    { name = "Patrick K. Erdelt", email = "patrick.erdelt@bht-berlin.de" }
]
keywords        = ["DBMS", "benchmarking", "performance evaluation", "Kubernetes", "cloud-native", "reproducibility"]
classifiers     = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: System :: Benchmark",
]

[project.urls]
Homepage      = "https://github.com/Beuth-Erdelt/Benchmark-Experiment-Host-Manager"
Repository    = "https://github.com/Beuth-Erdelt/Benchmark-Experiment-Host-Manager"
Documentation = "https://bexhoma.readthedocs.io"
Changelog     = "https://github.com/Beuth-Erdelt/Benchmark-Experiment-Host-Manager/releases"
Issues        = "https://github.com/Beuth-Erdelt/Benchmark-Experiment-Host-Manager/issues"

# ---- Console scripts ----
[project.scripts]
bexhoma      = "bexhoma.scripts.cli:main"
bexperiments = "bexhoma.scripts.experimentsmanager:manage"

# ---- Optional extras ----
# The benchmark agent prototype under agent/ speaks to a self-hosted,
# OpenAI-compatible server through this client, and reads the endpoint it points
# at from an optional .env file. Both are an extra rather than a requirement so
# that ordinary bexhoma users do not install them.
#   pip install -e ".[agent]"
[project.optional-dependencies]
agent = ["openai>=1.0", "python-dotenv>=1.0", "httpx>=0.27"]

# ---- setuptools configuration ----
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bexhoma*", "agent*"]

# Keep executable benchmark scripts at the repository root out of collection.
# Maintained automated tests live under tests/; the root scripts are invoked
# directly and some deliberately exit after completing cluster work.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage of the package and the agent. The collector validations run as
# subprocesses (tests/test_collector_validations.py); they are measured too.
[tool.coverage.run]
source = ["bexhoma", "agent"]
patch = ["subprocess"]

[tool.coverage.report]
# Floor below the coverage reached (70% locally on 2026-11-20); set it to the
# CI value after the first run there, and raise it when tests are added.
fail_under = 68
show_missing = false
skip_empty = true

# ---- Dynamic metadata sources ----
[tool.setuptools.dynamic]
version = { attr = "bexhoma.__version__.__version__" }
dependencies = { file = ["requirements.txt"] }
