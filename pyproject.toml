[build-system]
requires        = ["setuptools>=67", "wheel"]
build-backend   = "setuptools.build_meta"

[project]
name            = "bexhoma"
dynamic         = ["version", "dependencies"]
description     = "This python tools helps managing DBMS benchmarking experiments in a Kubernetes-based HPC cluster environment. It enables users to configure hardware / software setups for easily repeating tests over varying configurations."
readme          = { file = "README.md", content-type = "text/markdown" }
license         = { text = "GNU Affero General Public License v3" }
requires-python = ">=3.10.2"
authors         = [
    { name = "Patrick K. Erdelt", email = "patrick.erdelt@bht-berlin.de" }
]
classifiers     = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage   = "https://github.com/Beuth-Erdelt/Benchmark-Experiment-Host-Manager"
Repository = "https://github.com/Beuth-Erdelt/Benchmark-Experiment-Host-Manager"

# ---- Console scripts ----
[project.scripts]
bexhoma      = "bexhoma.scripts.cli:main"
bexperiments = "bexhoma.scripts.experimentsmanager:manage"

# ---- Optional extras ----
# The benchmark agent prototype under agent/ speaks to a self-hosted,
# OpenAI-compatible server through this client, and reads the endpoint it points
# at from an optional .env file. Both are an extra rather than a requirement so
# that ordinary bexhoma users do not install them.
#   pip install -e ".[agent]"
[project.optional-dependencies]
agent = ["openai>=1.0", "python-dotenv>=1.0"]

# ---- setuptools configuration ----
[tool.setuptools]
include-package-data = true
py-modules = ["tpch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bexhoma*", "agent*"]

# Keep executable benchmark scripts at the repository root out of collection.
# Maintained automated tests live under tests/; the root scripts are invoked
# directly and some deliberately exit after completing cluster work.
[tool.pytest.ini_options]
testpaths = ["tests"]

# ---- Dynamic metadata sources ----
[tool.setuptools.dynamic]
version = { attr = "bexhoma.__version__.__version__" }
dependencies = { file = ["requirements.txt"] }
