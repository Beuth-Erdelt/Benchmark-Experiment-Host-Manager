# bexhoma catalog — prototype scope: TPC-H against PostgreSQL and PgDuckDB.
#
# STATUS: draft, not yet consumed by any code. This is the first slice of
# the catalog contract proposed in issue #764, narrowed to the pair chosen
# for the first implementation. See docs/Design-Catalog-Contract.md for the
# full design rationale, the complete (all-workload, all-system) breadth
# pass this was extracted from, and open questions.
#
# Two catalog concepts kept intentionally separate:
#   - workloads: what to run   (params, loading behavior, physical-design semantics)
#   - systems:   what to run it on (server knobs, physical-design support, profiles)
#
# A profile's `knobs:` are literal values an expert chose; `derive:` is only
# for the handful of quantities that should scale with an experiment's own
# resource limits. The derive expression language is deliberately minimal:
# arithmetic over exactly {memory_limit, cpu_limit, storage_class,
# scaling_factor} — no functions, no conditionals.
#
# experiment.yml's `resources.storage_class` is optional. Leaving it unset
# (the default) activates ephemeral storage: no PersistentVolumeClaim is
# provisioned, and the SUT gets node-local storage instead — typically fast,
# since it's whatever disk the node itself has attached, but tied to that
# node's lifetime. `resources.storage.size` is still honored either way. A
# profile only needs `requires: {storage_class: ...}` when it depends on a
# *specific* cluster-declared class (e.g. analytical-ssd below, which needs
# guaranteed NVMe for reproducible OLAP numbers) — see
# `bexhoma/clusters.py::Kubernetes.get_available_storage_types()` and the
# `-rst`/`--request-storage-type` CLI flag for the underlying mechanism.
#
# experiment.yml top-level shape — every key below is a SIBLING of every
# other key at the top of the file. In particular `loading:` is its own
# top-level key, not nested under `workload:`: bexhoma/spec.py::build_argv()
# reads it as `experiment.get("loading", {})`, so a `workload.loading` block
# resolves silently to nothing (no error — pods/threads/post_load flags are
# just dropped from the translated command).
#
#   mode:           run | profiling | start | load | empty | summary
#   title:          required — short human-readable name
#   hypothesis:     required — prose statement of what's being tested
#   discriminates:  required — list of factor(s) the experiment isolates, e.g. [system]
#   workload:       {name, params: {...}, rounds: [...], repetitions}
#   loading:        {pods, threads, split, post_load: {...}}  # top-level, sibling of workload:
#   systems:        [{name, profile, override: {...}}, ...]
#   observe:        {monitoring_sut, monitoring_cluster, monitoring_app}
#   placement:      {sut, loading, benchmarking}
#   resources:      {cpu: {...}, memory: {...}, storage: {...}, storage_class}
#
# See docs/Design-Catalog-Contract.md's "Worked example" section (and
# dev/catalog/experiment.yml alongside this file) for a complete, valid file.

workloads:
  tpch:
    why: "star-schema OLAP: 22 queries, multi-way joins, official TPC-H"
    resource_profile:
      cpu: high
      memory: high
      why: "multi-way hash joins and aggregation across 22 queries are CPU- and
        RAM-bound, and working-set size scales directly with scaling_factor;
        storage bandwidth matters less by comparison — weigh cpu/memory
        headroom heavily when choosing placement node-groups and
        experiment.yml resources: for this workload"
    supports: [PostgreSQL, PgDuckDB]  # full workload also supports MonetDB, MySQL,
                                       # MariaDB, DatabaseService, Citus, CedarDB —
                                       # trimmed to prototype scope here
    modes: [profiling, run, start, load, empty, summary]

    params:
      scaling_factor:
        type: int
        unit: GB
        why: "TPC-H scale factor, controls database size"
      timeout:
        type: int
        unit: seconds
        why: "per-query timeout"
      query_repeats:
        type: int
        default: 1
        min: 1
        why: "repeat each query N times per round"
      verify_result:
        type: bool
        default: false
        why: "validate result rows meet basic sanity checks"
      measure_datatransfer:
        type: bool
        default: false
        why: "additionally record bytes transferred per query"
      active_queries:
        type: list[int]
        default: all
        why: "restrict to a query subset, e.g. [5, 7, 8, 9, 21] = multi-way joins"
      recreate_parameter:
        type: bool
        default: false
        why: "regenerate random query parameters for each stream"
      shuffle_queries:
        type: bool
        default: false
        why: "shuffle query execution order independently per stream"
      limit_import_table:
        type: str
        default: ""
        why: "import only this table (partial re-loads)"
      refresh_streams:
        type: int
        default: 0
        why: "number of RF1/RF2 refresh-stream pairs run parallel to query streams"
      refresh_stream_offset:
        type: int
        default: 0
        why: "starting OFFSET+1 for the refresh stream"
      verbose_explain:
        type: bool
        default: false
        why: "run and print configured EXPLAIN statements after each benchmark query (requires an 'explain' key in the DBMS connection's JDBC config)"

    loading:
      pods:
        type: int
        min: 1
        why: "number of parallel loader pods"
      threads:
        type: int
        min: 1
        why: "loader threads, split across pods"
      split:
        type: int
        default: 1
        why: "number of parallel loader batches"
      post_load:
        # This block is the *legality* menu only: which post_load option names
        # exist for tpch, and what values are legal for each. It says nothing
        # about which systems in a given experiment actually receive them —
        # that's a separate, experiment-level *selection* choice (see
        # experiment.yml's systems[].post_load, and "Validation ordering" in
        # docs/Design-Catalog-Contract.md). A third axis, *support*
        # (systems.<name>.physical_design below), says which systems are even
        # capable of a given option — capable-of is necessary but not
        # sufficient for will-receive-it: PgDuckDB's physical_design (below)
        # is fully capable of all three, and an experiment can still choose
        # not to apply them there.
        indexes:
          type: bool
          default: false
          why: "create indexes on all tables after loading; without this, plans fall back to sequential scans"
        constraints:
          type: bool
          default: false
          why: "add primary-key/foreign-key constraints after loading; deferred because per-row checks slow bulk COPY"
        statistics:
          type: bool
          default: false
          why: "run ANALYZE after loading; without it the planner has no cardinality estimates for round 1"
        storage_format:
          type: enum
          values: [heap]  # columnar exists in the general schema (Citus) but is out of scope for this pair
          default: heap

    rounds:
      type: list[int]
      why: "comma-separated parallel-client sweep; one benchmarking round per entry"
    repetitions:
      type: int
      default: 1
      why: "how many times the whole round list repeats"

    produces:
      per_query:
        metric: latency
        unit: ms
        why: "mean execution latency per query (DbmsBenchmarkerEvaluator.get_query_latencies()),
          one row per entry in active_queries — the finest-grained breakdown available"
      summary:
        metrics: [Power@Size, Throughput@Size, Geo Times]
        unit: [Q/h, Q/h, s]
        why: "geo-mean-derived per-phase metrics (get_summary_benchmark_per_phase());
          this is what a system/round/repetition comparison is actually made on"
      quality:
        metric: sql_errors_warnings
        why: "per-query error/warning counts (get_total_errors()/get_total_warnings()),
          recorded as pass/fail tests, not a performance metric"
      # no time_series entry: DBMSBenchmarker reports per-query and per-phase
      # aggregates only, no running per-second signal like YCSB/Benchbase produce

systems:
  PostgreSQL:
    deployment: bexhoma-deployment-postgres
    image: postgres:18.3
    arg_style: pg-guc  # patchable via bexhoma's existing --set / patch_dbms_args() mechanism

    knobs:
      # active in the shipped k8s/deploymenttemplate-PostgreSQL.yml today
      max_connections:                     {type: int, default: 640}
      max_worker_processes:                {type: int, default: 16}
      max_parallel_workers:                {type: int, default: 16}
      max_parallel_workers_per_gather:     {type: int, default: 8}
      max_parallel_maintenance_workers:    {type: int, default: 4}
      shared_buffers:                      {type: memory, default: 16GB}
      effective_cache_size:                {type: memory, default: 40GB}
      work_mem:                            {type: memory, default: 512MB}
      maintenance_work_mem:                {type: memory, default: 2GB}
      autovacuum:                          {type: enum, values: [on, off], default: off}
      wal_level:                           {type: enum, values: [minimal, replica, logical], default: minimal}
      max_wal_senders:                     {type: int, default: 0}
      max_wal_size:                        {type: memory, default: 32GB}
      checkpoint_timeout:                  {type: duration, default: 1h}
      checkpoint_completion_target:        {type: float, default: 1.0}
      lock_timeout:                        {type: duration, default: 30s}
      idle_in_transaction_session_timeout: {type: int, unit: ms, default: 30000}
      # known to the template as commented-out reference knobs, not active by
      # default — legal to set via a profile or an experiment override
      effective_io_concurrency:  {type: int, status: reference-only}
      io_method:                 {type: enum, values: [sync, io_uring], status: reference-only}
      random_page_cost:          {type: float, status: reference-only}
      seq_page_cost:             {type: float, status: reference-only}
      default_statistics_target: {type: int, status: reference-only}
      fsync:                     {type: enum, values: [on, off], status: reference-only}
      synchronous_commit:        {type: enum, values: [on, off], status: reference-only}
      wal_compression:           {type: enum, values: [on, off], status: reference-only}

    physical_design:
      indexes: true
      constraints: true
      statistics: true
      storage_format: [heap]

    profiles:
      analytical-ssd:
        why: "OLAP on node-local NVMe, sized from this experiment's memory limit"
        # ssd guarantees NVMe; null (ephemeral, i.e. resources.storage_class left
        # unset) is also node-local and typically fast, just without that guarantee
        # -- see catalog.yaml's header comment
        requires: {storage_class: [ssd, null]}
        knobs:
          random_page_cost: 1.1
          effective_io_concurrency: 200
          io_method: io_uring
          max_parallel_workers_per_gather: 2
          max_parallel_workers: 4
          max_worker_processes: 6
        derive:
          shared_buffers:       "0.3125 * memory_limit"
          effective_cache_size: "0.75 * memory_limit"
          work_mem:              "0.015625 * memory_limit"
          maintenance_work_mem:  "0.03125 * memory_limit"

  PgDuckDB:
    extends: PostgreSQL  # formalizes tpch.py's own path_experiment_docker='PostgreSQL' DDL reuse
    deployment: bexhoma-deployment-pg-duck
    image: pgduckdb/pgduckdb:18-v1.1.1
    arg_style: pg-guc

    knobs:
      shared_preload_libraries:
        type: str
        default: pg_duckdb
        fixed: true
        why: "loads the pg_duckdb extension; not meant to be overridden"
      duckdb_force_execution:
        type: bool
        default: false
        arg_style: env-var  # NOT a -c GUC — routes through bexhoma's sut_parameters, not patch_dbms_args()
        env_var: DUCKDB_FORCE_EXECUTION
        why: "force every query through DuckDB's execution engine rather than pg_duckdb's own cost-based routing"
      # all other knobs inherit unchanged from PostgreSQL via `extends` —
      # PgDuckDB's shipped template is a strict subset of PostgreSQL's active knobs

    physical_design:
      # Explicitly re-declared (not merely inherited via `extends`) because
      # this is a genuine capability statement, deliberately identical to
      # PostgreSQL's: PgDuckDB *can* have indexes/constraints/statistics
      # applied post-load. Whether a given experiment.yml actually applies
      # them here is a separate, per-experiment selection choice
      # (systems.PgDuckDB.post_load, if set) — this block only says "can",
      # never "will".
      indexes: true
      constraints: true
      statistics: true
      storage_format: [heap]
      # columnar (native `USING duckdb` tables) is deliberately NOT listed as
      # supported: blocked upstream (github.com/duckdb/pg_duckdb#385).
      # experiments/tpch/PgDuckDB/ is orphaned; tpch.py currently points
      # PgDuckDB at experiments/tpch/PostgreSQL/ instead.

    profiles:
      analytical-ssd:
        ref: PostgreSQL.profiles.analytical-ssd  # same profile object, both systems — this is what "parity" means for this pair
