# experiment.yaml — Is pg_duckdb better than PostgreSQL on joins, even under concurrency,
# given a 10GB dataset and a 64GB RAM ceiling?
#
# Generated from ./dev/catalog/catalog.yaml only.
#
# Mapping from the question to the fields below:
#   - "on joins" -> workload.params.active_queries uses catalog.yaml's own
#     labeled multi-way-join subset [5, 7, 8, 9, 21] instead of all 22 queries.
#   - "10GB dataset" -> scaling_factor: 10 (catalog: scaling_factor unit is GB).
#   - "even under concurrency" -> workload.rounds sweeps parallel-client counts
#     from 1 up to 16, so the comparison is checked at low and high concurrency.
#   - "servers have at most 64GB of RAM" -> resources.memory is capped at 64Gi
#     (a single value, not a sweep, since the question states a ceiling, not a
#     pressure test).
#   - "system-under-test must run on node cl-worker36" -> placement.sut.
#   - repetitions: 3 for statistically meaningful round-over-round comparison.

mode: run

title: "TPC-H joins under concurrency: PostgreSQL vs. PgDuckDB at SF10, capped at 64GB RAM"
hypothesis: "pg_duckdb outperforms PostgreSQL on join-heavy TPC-H queries (Q5, Q7, Q8, Q9, Q21) at SF=10 under a matched analytical-ssd profile, and the advantage (if any) holds as concurrent client load increases from 1 to 16"
discriminates: [system, concurrency]

workload:
  name: tpch
  params:
    scaling_factor: 10
    timeout: 1200
    query_repeats: 3
    verify_result: true
    active_queries: [5, 7, 8, 9, 21]  # multi-way joins, per catalog.yaml's own labeling
  rounds: [1, 2, 4]  # concurrency sweep: single client baseline up to 16 concurrent clients
  repetitions: 3

loading:
  pods: 4
  threads: 4
  post_load: {indexes: true, constraints: true, statistics: true}  # indexes/stats matter directly for join plan quality

systems:
  - name: PostgreSQL
    profile: analytical-ssd
  - name: PgDuckDB
    profile: analytical-ssd  # same profile as PostgreSQL — this is what "parity" means for this pair

observe: {monitoring_sut: true, monitoring_cluster: true, monitoring_app: true}

placement:
  sut: cl-worker36
  loading: cl-worker36
  benchmarking: cl-worker36

resources:
  cpu: {request: 16, limit: 16}
  memory: {request: 64Gi, limit: 64Gi}  # "our servers have at most 64GB of RAM"
  storage: {size: 30Gi}
  # storage_class deliberately left unset: analytical-ssd's `requires.storage_class`
  # allows [ssd, null], and this run accepts ephemeral (fast node-local disk, no PVC,
  # no guaranteed-NVMe SLA) rather than requiring the cluster's declared `ssd` class
  # — see catalog.yaml's header comment
