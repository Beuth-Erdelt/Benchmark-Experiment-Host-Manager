# Self-hosted model server for the agent harness.
#
# Serves QuantTrio/GLM-4.5-Air-GPTQ-Int4-Int8Mix through vLLM's OpenAI-compatible
# API, which is what agent/harness/llm.py speaks. Alternative to
# agent/k8s/vllm-qwen38-27b.yml; select it with MODEL_SERVER_MANIFEST or
# `agent/lifecycle.py --model-server-manifest`. Follows the same shape as the
# other vLLM servers in this cluster: one Pod that downloads the weights into a
# PVC on first start and serves them from there afterwards.
#
# This was originally meant to serve cerebras/GLM-4.5-Air-REAP-82B-A12B (a
# REAP-pruned, 82B-total/12B-active-parameter distillation of GLM-4.5-Air) at
# INT4, but the only INT4 requantizations of that pruned checkpoint
# (MidnightPhreaker's GPTQ-INT4-gs32 and AWQ-4bit repos) return 401
# Unauthorized from both outside the cluster and from inside this pod's own
# download step -- gated or private, indistinguishable from the outside, and
# neither is reachable without a Hugging Face account this deployment does not
# have. QuantTrio/GLM-4.5-Air-GPTQ-Int4-Int8Mix is confirmed public and stays
# in the same INT4-quantization family, but quantizes the full, un-pruned
# GLM-4.5-Air (106B total / 12B active parameters, ~67GB of weights) rather
# than the REAP-82B checkpoint. Revisit MidnightPhreaker's repos if they ever
# become reachable -- they would let this manifest shrink back to the smaller
# REAP-pruned model.
#
# 67GB of weights leaves too little of an 80GB H100 for KV cache at any useful
# context length once vLLM's own overhead is accounted for, so despite
# --tensor-parallel-size 1 below matching every other manifest in this
# cluster, this one is pinned to the H200 node specifically (141GB) in the
# affinity block, unlike the Qwen and REAP-82B-INT4 manifests, which accept
# either Hopper node. This assumes at least one H200 in the cluster is not
# cl-worker36 (excluded below regardless of its GPU type); confirm that with
# `kubectl get nodes -L gpu` before relying on this manifest, since a cluster
# where the only H200 is cl-worker36 would leave this pod Pending indefinitely.
#
# The pod is self-cleaning: an idle watchdog beside the server releases the GPU
# once nothing has sent a request for IDLE_SHUTDOWN_SECONDS, so a forgotten
# server does not hold a Hopper node indefinitely. This is independent of the
# operator wrapper, which shuts the server down promptly when it is in charge.
#
# Placement note: node affinity excludes cl-worker36. cl-worker36 is where
# bexhoma puts the system under test, and a model server competing for that
# node's CPU, memory and page cache would contaminate the measurements the
# agent is designing.
#
# The objects carry no namespace of their own: agent/model_server.sh applies them
# into MODEL_SERVER_NAMESPACE, so this manifest is not tied to one account.
#
# Reach it from a laptop with:
#   kubectl -n "$MODEL_SERVER_NAMESPACE" port-forward svc/bexhoma-agent-model 8000:80
#
# Copyright (C) 2026 Patrick K. Erdelt
# SPDX-License-Identifier: AGPL-3.0-or-later
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bexhoma-agent-model-weights-glm45
  labels: {app: bexhoma, component: agent, role: model-server}
spec:
  accessModes:
    - ReadWriteOnce
  # Per-cluster: name a storage class your account can claim 180Gi from.
  storageClassName: cephcsi
  resources:
    requests:
      # Confirmed ~67GB of weights, doubled for room for a second revision,
      # plus a margin above the exact 2x figure. A separate PVC from the Qwen
      # manifest's, so switching between them never re-downloads either
      # model's weights.
      storage: 180Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bexhoma-agent-model
  labels: {app: bexhoma, component: agent, role: model-server}
spec:
  selector:
    app: bexhoma
    component: agent
    role: model-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: bexhoma-agent-model
  annotations:
    # The switch replaces older immutable Pod specifications before apply. This
    # must differ from the Qwen manifest's "idle-watchdog-v2" even though the
    # watchdog script itself is unchanged: the two manifests share the same pod
    # name, and this is the only signal that tells the switch a live pod is
    # serving the wrong model and must be replaced rather than left alone.
    bexhoma.local/model-server-generation: idle-watchdog-v2-glm45-air-int4
  labels: {app: bexhoma, component: agent, role: model-server}
spec:
  containers:
    - name: vllm-container
      # Same digest as agent/k8s/vllm-qwen38-27b.yml, for the image-pinning
      # reason given there: an unrelated upstream "latest" update should not
      # silently change model-loading behaviour. It was verified against
      # Qwen3.8, not against this model's GPTQ MoE kernels or GLM4_MOE
      # architecture support; if the pod crash-loops on startup, check the
      # vLLM version this image carries against what the quantizer's model
      # card documents as tested, and re-pin a compatible digest if they differ.
      image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
      imagePullPolicy: IfNotPresent
      env:
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        - name: NCCL_IGNORE_CPU_AFFINITY
          value: "1"
        # Comfortably longer than any gap between the agent's own calls within
        # one phase, and far shorter than the hours a benchmark takes.
        - name: IDLE_SHUTDOWN_SECONDS
          value: "1200"
        - name: IDLE_POLL_SECONDS
          value: "60"
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: 160Gi
        requests:
          nvidia.com/gpu: "1"
          memory: 96Gi
          cpu: "8"
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      # Without these, the pod reports Ready the moment the shell starts, which
      # is long before the weights are downloaded and the engine is loaded --
      # "Running" would then mean nothing to anyone waiting to send a request.
      # The startup probe carries the first-start download, roughly 67 GB.
      startupProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 20
        failureThreshold: 200
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 15
        failureThreshold: 3
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-storage
          mountPath: /models
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          MODEL_REPO="QuantTrio/GLM-4.5-Air-GPTQ-Int4-Int8Mix"
          LOCAL_DIR="/models/glm-4.5-air-gptq-int4-int8mix"
          # Which exact upstream commit was downloaded, so a served alias built
          # from it (below) tells a trajectory which weights answered, not just
          # which repo they came from -- "main" moves, this file does not.
          REVISION_FILE="$LOCAL_DIR/.hf-revision"
          # Zero disables the watchdog and restores a server that runs until
          # something deletes it.
          IDLE_SHUTDOWN_SECONDS="${IDLE_SHUTDOWN_SECONDS:-1200}"
          IDLE_POLL_SECONDS="${IDLE_POLL_SECONDS:-60}"
          SHUTDOWN_GRACE_SECONDS=30

          python3 -c "import vllm, transformers; print('vllm', vllm.__version__, '| transformers', transformers.__version__)"

          if [ -f "$LOCAL_DIR/config.json" ]; then
              echo "Model already present at $LOCAL_DIR"
          else
              echo "Resolving the current commit of $MODEL_REPO ..."
              # Pinned explicitly rather than left as the default "main", so a
              # PVC wiped and recreated later downloads this same commit instead
              # of whatever upstream has since pushed to the branch.
              RESOLVED_REVISION="$(python3 -c "
          from huggingface_hub import HfApi
          print(HfApi().model_info('$MODEL_REPO').sha)
          ")"
              echo "Downloading $MODEL_REPO @ $RESOLVED_REVISION ..."
              # `hf`, not `huggingface-cli`: the old entry point still exists in
              # this image but prints a deprecation notice and exits 0 without
              # downloading anything, which looks like success and then leaves
              # vLLM crash-looping on an empty directory.
              hf download "$MODEL_REPO" --revision "$RESOLVED_REVISION" --local-dir "$LOCAL_DIR"
              echo "$RESOLVED_REVISION" > "$REVISION_FILE"
          fi

          if [ ! -f "$LOCAL_DIR/config.json" ]; then
              echo "ERROR: no config.json under $LOCAL_DIR after download"
              exit 1
          fi

          # The trajectory records whatever alias the server answers to (see
          # ChatModel.resolve_served_model in agent/harness/model_client.py), so
          # folding the resolved commit into it is what lets a trajectory alone
          # identify the exact weights, not just the repo, that produced it. A
          # directory left over from before this revision file existed still
          # serves, just without that suffix.
          SERVED_MODEL_NAME="$MODEL_REPO"
          if [ -f "$REVISION_FILE" ]; then
              SERVED_MODEL_NAME="${MODEL_REPO}@$(cut -c1-12 "$REVISION_FILE")"
          fi

          # glm45 is vLLM's documented reasoning/tool-call parser pair for the
          # GLM-4.5 family. --quantization is left unset: vLLM auto-detects
          # GPTQ from the checkpoint's own quantization_config, the same
          # convention the Qwen FP8 manifest follows for its checkpoint.
          #
          # 65536 rather than this architecture's native 131072: at ~67GB the
          # weights alone leave little headroom even on the H200 this pod is
          # pinned to, and KV cache for GLM-4.5-Air's 46 layers / 8 KV heads /
          # 128-dim head scales directly with context length -- roughly 92KiB
          # per token with --kv-cache-dtype fp8, so a single full-length 64k
          # request costs on the order of 6GB. Raise it only after confirming
          # actual memory headroom on this pod with `nvidia-smi` or vLLM's own
          # startup log, which reports the KV cache blocks it allocated.
          #
          # Started in the background rather than exec'd, because the shell
          # stays alive as the idle watchdog below. That is what makes the pod
          # self-cleaning: the agent is stateless between phases, so a server
          # nobody is talking to is a stranded GPU, and the operator wrapper
          # that normally shuts it down is absent whenever a phase was launched
          # by hand.
          #
          # --enable-log-requests logs each request's resolved SamplingParams at
          # INFO (already the level set above), which is how to confirm the
          # temperature model_client.py sends is the one actually used -- the
          # model's generation_config.json only supplies temperature/top_k/top_p
          # for requests that omit them, but that is easy to doubt from the
          # WARNING vLLM prints about it at startup.
          python3 -m vllm.entrypoints.openai.api_server \
            --model "$LOCAL_DIR" \
            --served-model-name "$SERVED_MODEL_NAME" \
            --tensor-parallel-size 1 \
            --max-model-len 65536 \
            --max-num-seqs 256 \
            --kv-cache-dtype fp8 \
            --gpu-memory-utilization 0.92 \
            --reasoning-parser glm45 \
            --enable-auto-tool-choice \
            --tool-call-parser glm45 \
            --trust-remote-code \
            --enable-log-requests \
            --host 0.0.0.0 \
            --port 8000 &
          VLLM_PID=$!

          if [ "$IDLE_SHUTDOWN_SECONDS" -le 0 ]; then
              wait "$VLLM_PID"
              exit $?
          fi

          # Two independent signals of use, because either alone is wrong. The
          # gauges catch a single long request that spans several polls; the
          # monotonic counters catch short requests that start and finish
          # entirely between two polls and would otherwise be invisible.
          probe_activity() {
              python3 - <<'PY'
          import sys
          import urllib.request

          IN_FLIGHT = ("vllm:num_requests_running", "vllm:num_requests_waiting")
          COMPLETED = ("vllm:request_success_total", "vllm:prompt_tokens_total",
                       "vllm:generation_tokens_total")
          in_flight = 0.0
          completed = 0.0
          saw_in_flight = False
          saw_completed = False
          try:
              with urllib.request.urlopen(
                      "http://127.0.0.1:8000/metrics", timeout=10) as response:
                  body = response.read().decode("utf-8", "replace")
          except OSError as error:
              print(f"metrics unreadable: {error}", file=sys.stderr)
              sys.exit(1)
          for line in body.splitlines():
              if line.startswith("#"):
                  continue
              name, _, value = line.rpartition(" ")
              name = name.split("{", 1)[0].strip()
              try:
                  value = float(value)
              except ValueError:
                  continue
              if name in IN_FLIGHT:
                  in_flight += value
                  saw_in_flight = True
              elif name in COMPLETED:
                  completed += value
                  saw_completed = True
          # Never report idleness from metric names this vLLM build does not
          # publish. Both classes are required: gauges protect long requests,
          # while counters reveal short requests completed between two polls.
          if not saw_in_flight or not saw_completed:
              print("incomplete vLLM request metrics in /metrics", file=sys.stderr)
              sys.exit(1)
          print(f"{in_flight:.0f} {completed:.3f}")
          PY
          }

          idle_seconds=0
          last_completed=""
          while true; do
              sleep "$IDLE_POLL_SECONDS"

              # A server that died on its own must exit non-zero so that
              # restartPolicy OnFailure brings it back; only the idle path
              # below is allowed to end the pod successfully.
              if ! kill -0 "$VLLM_PID" 2>/dev/null; then
                  vllm_status=0
                  wait "$VLLM_PID" || vllm_status=$?
                  echo "vLLM exited with status ${vllm_status}; restarting"
                  # Non-zero even when vLLM exited cleanly: only the idle path
                  # may end this pod successfully, or a server that quietly
                  # stopped would drop the GPU mid-investigation.
                  exit $(( vllm_status == 0 ? 1 : vllm_status ))
              fi

              if ! reading=$(probe_activity); then
                  idle_seconds=0
                  continue
              fi
              in_flight="${reading%% *}"
              completed="${reading##* }"
              if [ "$in_flight" != "0" ] || [ "$completed" != "$last_completed" ]; then
                  idle_seconds=0
                  last_completed="$completed"
                  continue
              fi

              idle_seconds=$((idle_seconds + IDLE_POLL_SECONDS))
              if [ "$idle_seconds" -ge "$IDLE_SHUTDOWN_SECONDS" ]; then
                  echo "no requests for ${idle_seconds}s; releasing the GPU"
                  kill -TERM "$VLLM_PID" 2>/dev/null || true
                  remaining_grace_seconds="$SHUTDOWN_GRACE_SECONDS"
                  while kill -0 "$VLLM_PID" 2>/dev/null \
                      && [ "$remaining_grace_seconds" -gt 0 ]; do
                      sleep 1
                      remaining_grace_seconds=$((remaining_grace_seconds - 1))
                  done
                  if kill -0 "$VLLM_PID" 2>/dev/null; then
                      echo "vLLM did not stop within ${SHUTDOWN_GRACE_SECONDS}s; forcing shutdown"
                      kill -KILL "$VLLM_PID" 2>/dev/null || true
                  fi
                  wait "$VLLM_PID" 2>/dev/null || true
                  exit 0
              fi
          done
  # OnFailure, not the default Always: it lets a crashed server come back while
  # allowing the idle watchdog's clean exit to actually end the pod. Under
  # Always the pod would restart itself immediately and take the GPU again.
  restartPolicy: OnFailure
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          # H200 only, unlike the Qwen and REAP-82B-INT4 manifests: see the
          # sizing note at the top of this file for why an H100's 80GB does
          # not leave enough room for this model's ~67GB of weights plus any
          # useful KV cache.
          - matchExpressions:
              - key: gpu
                operator: In
                values: [h200, b200]
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: model-storage
      persistentVolumeClaim:
        claimName: bexhoma-agent-model-weights-glm45
