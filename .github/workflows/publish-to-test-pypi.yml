name: Publish Python 🐍 distributions 📦 to PyPI and TestPyPI

# Publishing a GitHub release uploads the package. GitHub ignores branch and tag
# filters on release events, so the gate job checks the tag itself.
on:
  release:
    types: [published]
  # manual rerun of a release: start it on the tag, not on a branch
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag vX.Y.Z equals the version of the package
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "exec(open('bexhoma/__version__.py').read()); print(__version__)")
          if [[ "$REF_TYPE" != "tag" || "$TAG" != "v$VERSION" ]]; then
            echo "::error::release tag '$TAG' ($REF_TYPE) does not match the package version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Minor release X.Y.0 needs the reference experiments
        run: |
          if [[ "$VERSION" == *.0 ]]; then
            python scripts/demo-runs.py --release-gate "$VERSION"
          else
            echo "patch release $VERSION: the reference experiments are not required"
          fi

  release:
    needs: [tests, gate]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
        .
    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository_url: https://test.pypi.org/legacy/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
