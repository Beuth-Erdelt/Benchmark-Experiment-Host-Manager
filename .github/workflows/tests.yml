name: Tests
on:
  pull_request:
  push:
    branches: [master, dev]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest -e ".[agent]"
      - run: python -m pytest tests -q
