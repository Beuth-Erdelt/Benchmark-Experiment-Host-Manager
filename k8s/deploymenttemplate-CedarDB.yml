apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: shared
---
apiVersion: v1
kind: Service
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-service
spec:
  ports:
  - {port: 9091, protocol: TCP, name: port-dbms, targetPort: 5432}
  - {port: 9300, protocol: TCP, name: port-monitoring, targetPort: 9300}
  selector: {app: bexhoma, component: sut, configuration: default, experiment: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-deployment-cedardb
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  template:
    metadata:
      labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      terminationGracePeriodSeconds: 180
      initContainers:
        # the CedarDB image has no psql, loadData needs one (Community Edition: no derived image, it must not be passed on)
        - name: psql-client
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
                mkdir -p /pgclient/lib
                cp /usr/lib/postgresql/18/bin/psql /pgclient/psql.bin
                ldd /pgclient/psql.bin | awk '/=> \//{print $3}' | grep -v -E '/(libc|libm|libdl|libpthread|librt)\.so' | xargs -I{} cp -L {} /pgclient/lib/
                printf '#!/bin/sh\nLD_LIBRARY_PATH=/pgclient/lib exec /pgclient/psql.bin "$@"\n' > /pgclient/psql
                chmod 755 /pgclient/psql /pgclient/psql.bin
          volumeMounts:
          - {mountPath: /pgclient, name: pgclient}
      containers:
      - name: dbms
        image: cedardb/cedardb:v2026-10-22 # sha256:d029f6d020edeedfe86d26525b9aac436d7aad3f8702aca1b39992456a1e2777
        # the entrypoint binds to :: and adding -address is refused as given twice, pods have no IPv6;
        # raise soft nofile limit (1024) to the hard limit
        command: ["bash", "-c", "sed -i 's/-address=::/-address=0.0.0.0/' /usr/local/bin/docker-entrypoint.sh; ulimit -S -n \"$(ulimit -H -n)\" || true; exec docker-entrypoint.sh"]
        env:
        - name: CEDAR_USER
          value: postgres
        # at least 20 characters and two character categories; = JDBC auth of cluster.config, no special characters
        - name: CEDAR_PASSWORD
          value: BexhomaBenchmarkPassword2026
        # for loadData
        - name: PGPASSWORD
          value: BexhomaBenchmarkPassword2026
        readinessProbe:
          exec:
            command: ["pg_isready"]   # wrapper of cedardb -isready
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
        ports:
        - {containerPort: 5432}
        securityContext:
          allowPrivilegeEscalation: false
          #runAsNonRoot: true
          #runAsUser: 1000
          #runAsGroup: 1000
          #capabilities:
          #  drop:
          #    - ALL
          #readOnlyRootFilesystem: true #could not create lock file "/var/run/postgresql/.s.PGSQL.5432.lock": Read-only file system
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 1000m, memory: 1Gi}
          #, ephemeral-storage: "1536Gi"}
        volumeMounts:
        - {mountPath: /data, name: benchmark-data-volume}
        - {mountPath: /dev/shm, name: dshm}
        - {mountPath: /pgclient, name: pgclient}
        - {mountPath: /var/lib/cedardb/data, name: benchmark-storage-volume}
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.47.0
        args: ["--port", "9300", "--storage_duration", "20m0s", "--docker_only", "true", "--disable_metrics", "disk,network,tcp,advtcp,udp,sched,process,hugetlb", "--application_metrics_count_limit", "30", "--housekeeping_interval", "5s"]
        ports:
        - containerPort: 9300
          #hostPort: 9300
          name: http
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          #runAsNonRoot: true
          #runAsUser: 1000
          #runAsGroup: 1000
          #capabilities:
          #  drop:
          #    - ALL
          readOnlyRootFilesystem: true
        resources:
          requests: {cpu: 150m, memory: 200Mi}
          limits: {cpu: 16000m, memory: 128Gi}
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs
          readOnly: true
        - name: var-run
          mountPath: /var/run
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: docker
          mountPath: /var/lib/docker
          readOnly: true
        - name: disk
          mountPath: /dev/disk
          readOnly: true
      volumes:
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: bexhoma-data}
      - name: benchmark-storage-volume
        persistentVolumeClaim: {claimName: bexhoma-storage}
      - name: pgclient
        emptyDir: {}
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker
      - name: disk
        hostPath:
          path: /dev/disk
      - name: dshm
        emptyDir:
          medium: Memory
