# Generated file, DO NOT EDIT. Source: cloud/kubernetes/templates/cluster-init.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-init
  labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
  #labels:
  #  app: cockroachdb
spec:
  template:
    metadata:
      labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: cluster-init
        image: cockroachdb/cockroach:v24.2.4
        imagePullPolicy: IfNotPresent
        #env:
        #- name: BEXHOMA_WORKER_LIST
        #  value: cockroachdb-0.cockroachdb,cockroachdb-1.cockroachdb,cockroachdb-2.cockroachdb
        env:
        - name: BEXHOMA_WORKER_FIRST
          value: cockroachdb-0.cockroachdb
        command:
          - "/bin/bash"
          - "-ec"
          - |
            echo "Starting CockroachDB safe init job..."

            HOST="${BEXHOMA_WORKER_FIRST}"

            # The job starts together with the workers; until the first worker
            # resolves and listens, init fails. Retry here instead of failing the
            # container, so a restart of this job means a real failure.
            LIMIT=""
            if command -v timeout >/dev/null 2>&1; then LIMIT="timeout 30"; fi
            for attempt in $(seq 1 60); do
              echo "Attempt $attempt: running init on $HOST ..."
              if output=$($LIMIT cockroach init --insecure --host="$HOST" 2>&1); then
                echo "$output"
                echo "Cluster init completed."
                exit 0
              fi
              echo "$output"
              if echo "$output" | grep -q "already been initialized"; then
                echo "Cluster already initialized. Nothing to do."
                exit 0
              fi
              sleep 5
            done
            echo "Cluster init failed: $HOST not reachable."
            exit 1
  ttlSecondsAfterFinished: 300
