apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bexhoma-worker
  labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
#metadata:
#  name: cockroachdb
spec:
  serviceName: bexhoma-workers
  #serviceName: "cockroachdb"
  replicas: 3
  selector:
    matchLabels:
      {app: bexhoma, component: worker, configuration: default, experiment: default}
  #selector:
  #  matchLabels:
  #    app: cockroachdb
  template:
    metadata:
      #labels:
      #  app: cockroachdb
      labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cockroachdb
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      containers:
      - name: dbms
        image: cockroachdb/cockroach:v24.2.4
        imagePullPolicy: IfNotPresent
        # TODO: Change these to appropriate values for the hardware that you're running. You can see
        # the resources that can be allocated on each of your Kubernetes nodes by running:
        #   kubectl describe nodes
        # Note that requests and limits should have identical values.
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 16000m, memory: 128Gi}
          #, ephemeral-storage: "1536Gi"}
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8080
          name: http
# CockroachDB's own guidance against a liveness probe assumes a production
# cluster where a hung node should keep serving reads to healthy ranges rather
# than be killed. On this shared benchmarking cluster a hung node just returns
# errors to clients for the rest of the run, so a lenient probe (60s grace) is
# used to recover automatically instead.
        livenessProbe:
          httpGet:
            path: "/health"
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: "/health?ready=1"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
        volumeMounts:
        - {mountPath: /cockroach/cockroach-data/extern/data, name: benchmark-data-volume}
        - name: bxw
          mountPath: /cockroach/cockroach-data
        env:
        #- name: BEXHOMA_WORKER_LIST
        #  value: cockroachdb-0.cockroachdb,cockroachdb-1.cockroachdb,cockroachdb-2.cockroachdb
        - name: COCKROACH_CHANNEL
          value: kubernetes-insecure
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        - name: MEMORY_LIMIT_MIB
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
              divisor: "1Mi"
        command:
          - "/bin/bash"
          - "-ecx"
          # The use of qualified `hostname -f` is crucial:
          # Other nodes aren't able to look up the unqualified hostname.
          - exec
            /cockroach/cockroach
            start
            --logtostderr
            --insecure
            --advertise-host $(hostname -f)
            --http-addr 0.0.0.0
            --join $(expr $BEXHOMA_WORKER_LIST)
            --cache $(expr $MEMORY_LIMIT_MIB / 5)MiB
            --max-sql-memory $(expr $MEMORY_LIMIT_MIB / 5)MiB
      # No pre-stop hook is required, a SIGTERM plus some time is all that's
      # needed for graceful shutdown of a node.
      terminationGracePeriodSeconds: 60
      volumes:
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: bexhoma-data}
      - name: bxw
        persistentVolumeClaim: {claimName: bxw}
      - name: dshm
        emptyDir:
          medium: Memory
      #- name: datadir
      #  persistentVolumeClaim:
      #    claimName: datadir
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      name: bxw
      labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
    spec:
      accessModes:
        - "ReadWriteOnce"
      resources:
        requests:
          storage: 100Gi
      storageClassName: shared
