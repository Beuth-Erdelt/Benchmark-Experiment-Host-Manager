# maxUnavailable: 1 keeps a majority (2 of 3) of CockroachDB nodes available
# during voluntary disruptions (node drains, evictions) on this shared cluster.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bexhoma-worker
  labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: bexhoma, component: worker, configuration: default, experiment: default}
