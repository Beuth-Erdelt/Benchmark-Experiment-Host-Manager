apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: shared
---
apiVersion: v1
kind: Service
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-service
spec:
  ports:
  # HTTP interface (JDBC driver)
  - {port: 9091, protocol: TCP, name: port-dbms, targetPort: 8123}
  # native protocol (clickhouse-client, e.g. of loader pods); port-sut-* is kept without monitoring
  - {port: 9000, protocol: TCP, name: port-sut-native, targetPort: 9000}
  - {port: 9300, protocol: TCP, name: port-monitoring, targetPort: 9300}
  - {port: 9363, protocol: TCP, name: port-monitoring-application, targetPort: 9363}
  selector: {app: bexhoma, component: sut, configuration: default, experiment: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-deployment-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  template:
    metadata:
      labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      # SIGTERM shuts ClickHouse down cleanly; give running merges time to finish
      terminationGracePeriodSeconds: 180
      containers:
      - name: dbms
        image: clickhouse/clickhouse-server:26.8.34.13 # LTS
        # raise soft nofile limit to the hard limit (ClickHouse recommends 262144),
        # write the bexhoma config, start server
        command:
          - bash
          - -ec
          - |
            ulimit -S -n "$(ulimit -H -n)" || true
            cat > /etc/clickhouse-server/config.d/bexhoma.xml <<EOF
            <clickhouse>
              <!-- application metrics (-ma) -->
              <prometheus>
                <port>9363</port>
                <endpoint>/metrics</endpoint>
                <metrics>true</metrics>
                <events>true</events>
                <asynchronous_metrics>true</asynchronous_metrics>
              </prometheus>
            </clickhouse>
            EOF
            # SQL-standard results: outer joins fill NULL (not 0 or ''), UNION means DISTINCT,
            # CAST keeps NULL, mixed Decimal/Float branches (CASE, COALESCE) get a numeric
            # common type
            cat > /etc/clickhouse-server/users.d/bexhoma.xml <<EOF
            <clickhouse>
              <profiles>
                <default>
                  <join_use_nulls>1</join_use_nulls>
                  <union_default_mode>DISTINCT</union_default_mode>
                  <cast_keep_nullable>1</cast_keep_nullable>
                  <allow_lossy_numeric_supertype>1</allow_lossy_numeric_supertype>
                </default>
              </profiles>
            </clickhouse>
            EOF
            exec /entrypoint.sh
        env:
        # keep user 'default' without password and with network access; without this
        # the entrypoint restricts 'default' to localhost
        - {name: CLICKHOUSE_SKIP_USER_SETUP, value: '1'}
        ports:
        - {containerPort: 8123, name: http}
        - {containerPort: 9000, name: native}
        - {containerPort: 9363, name: metrics}
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 1000m, memory: 1Gi}
        # instead of privileged: thread priorities (os_thread_priority), mlock of the binary,
        # per-query OS metrics from taskstats
        securityContext:
          capabilities:
            add: ["SYS_NICE", "IPC_LOCK", "NET_ADMIN"]
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - {mountPath: /data, name: benchmark-data-volume}
        - {mountPath: /var/lib/clickhouse, name: benchmark-storage-volume}
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.47.0
        args: ["--port", "9300", "--storage_duration", "20m0s", "--docker_only", "true", "--disable_metrics", "disk,network,tcp,advtcp,udp,sched,process,hugetlb", "--application_metrics_count_limit", "30", "--housekeeping_interval", "5s"]
        ports:
        - containerPort: 9300
          #hostPort: 9300
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 150m
            memory: 200Mi
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs
          readOnly: true
        - name: var-run
          mountPath: /var/run
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: docker
          mountPath: /var/lib/docker
          readOnly: true
        - name: disk
          mountPath: /dev/disk
          readOnly: true
      volumes:
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: bexhoma-data}
      - name: benchmark-storage-volume
        persistentVolumeClaim: {claimName: bexhoma-storage}
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker
      - name: disk
        hostPath:
          path: /dev/disk
