apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: shared
---
apiVersion: v1
kind: Service
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-service
spec:
  ports:
  - {port: 9091, protocol: TCP, name: port-dbms, targetPort: 6379}
  selector: {app: bexhoma, component: sut, configuration: default, experiment: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-deployment-garnet
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  template:
    metadata:
      labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      terminationGracePeriodSeconds: 180
      initContainers:
      # the Garnet image has no CLI: copy valkey-cli (as redis-cli, too) for the preStop hook and reset scripts
      - name: include-client
        image: valkey/valkey:9.1.3
        command: ["sh", "-c", "cp /usr/local/bin/valkey-cli /cli/valkey-cli && ln -sf valkey-cli /cli/redis-cli"]
        volumeMounts:
        - {mountPath: /cli, name: cli}
      containers:
      - name: dbms
        image: ghcr.io/microsoft/garnet:2.2.5
        # checkpoint (SAVE) and append-only file in /data, recovered at start, so a reused volume keeps its data
        args: ["--port", "6379", "--checkpointdir", "/data/checkpoints", "--aof", "--aof-commit-freq", "1000", "--recover"]
        env:
          - name: MASTER
            value: "true"
        ports:
          - containerPort: 6379
            name: server
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command: ["redis-cli", "save"]
        securityContext:
          allowPrivilegeEscalation: false
          #runAsNonRoot: true
          runAsUser: 0 # the volume is owned by root
          #runAsGroup: 1000
          #capabilities:
          #  drop:
          #    - ALL
          readOnlyRootFilesystem: false
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 1000m, memory: 1Gi}
          #, ephemeral-storage: "1536Gi"}
        volumeMounts:
        #- {mountPath: /data, name: benchmark-data-volume}
        - {mountPath: /data, name: benchmark-storage-volume}
        - {mountPath: /usr/local/bin, name: cli}
      volumes:
      - name: cli
        emptyDir: {}
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: bexhoma-data}
      - name: benchmark-storage-volume
        persistentVolumeClaim: {claimName: bexhoma-storage}
      - name: dshm
        emptyDir:
          medium: Memory
