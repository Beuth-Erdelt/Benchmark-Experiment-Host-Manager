# ClickHouse cluster: one coordinator (SUT) and N shards (worker StatefulSet, 1 replica each).
# - cluster name in remote_servers: bexhoma (all workers, one shard per pod, native port 9000)
# - the coordinator is not a shard: it is the entry point for clients and keeps the
#   Distributed tables, e.g.
#     CREATE TABLE t_local ON CLUSTER bexhoma (...) ENGINE = MergeTree ORDER BY ...;
#     CREATE TABLE t (...) ENGINE = Distributed(bexhoma, default, t_local, rand());
# - ON CLUSTER needs a Keeper: a single-node ClickHouse Keeper runs embedded in the
#   coordinator (port 9181); workers reach it via the SUT service
# - macros {shard} (pod ordinal) and {replica} (pod name) are set on workers for later
#   ReplicatedMergeTree setups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: shared
---
apiVersion: v1
kind: Service
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-service
spec:
  ports:
  # HTTP interface (JDBC driver)
  - {port: 9091, protocol: TCP, name: port-dbms, targetPort: 8123}
  # port-sut-* is kept without monitoring: native protocol (clickhouse-client) and Keeper (workers)
  - {port: 9000, protocol: TCP, name: port-sut-native, targetPort: 9000}
  - {port: 9181, protocol: TCP, name: port-sut-keeper, targetPort: 9181}
  - {port: 9300, protocol: TCP, name: port-monitoring, targetPort: 9300}
  - {port: 9363, protocol: TCP, name: port-monitoring-application, targetPort: 9363}
  selector: {app: bexhoma, component: sut, configuration: default, experiment: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-deployment-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  template:
    metadata:
      labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      # SIGTERM shuts ClickHouse down cleanly; give running merges time to finish
      terminationGracePeriodSeconds: 180
      containers:
      - name: dbms
        image: clickhouse/clickhouse-server:26.8.34.13 # LTS
        # raise soft nofile limit to the hard limit (ClickHouse recommends 262144),
        # write cluster and Keeper config from the worker list bexhoma sets, start server
        command:
          - bash
          - -ec
          - |
            ulimit -S -n "$(ulimit -H -n)" || true
            shards=""
            for host in $BEXHOMA_WORKER_LIST_SPACE; do
              shards="$shards<shard><replica><host>${host%%:*}</host><port>9000</port></replica></shard>"
            done
            cat > /etc/clickhouse-server/config.d/bexhoma-cluster.xml <<EOF
            <clickhouse>
              <remote_servers>
                <bexhoma>$shards</bexhoma>
              </remote_servers>
              <keeper_server>
                <tcp_port>9181</tcp_port>
                <server_id>1</server_id>
                <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
                <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
                <raft_configuration>
                  <server><id>1</id><hostname>localhost</hostname><port>9234</port></server>
                </raft_configuration>
              </keeper_server>
              <zookeeper>
                <node><host>localhost</host><port>9181</port></node>
              </zookeeper>
              <!-- application metrics (-ma) -->
              <prometheus>
                <port>9363</port>
                <endpoint>/metrics</endpoint>
                <metrics>true</metrics>
                <events>true</events>
                <asynchronous_metrics>true</asynchronous_metrics>
              </prometheus>
            </clickhouse>
            EOF
            cat /etc/clickhouse-server/config.d/bexhoma-cluster.xml
            # SQL-standard results: outer joins fill NULL (not 0 or ''), UNION means DISTINCT,
            # CAST keeps NULL, mixed Decimal/Float branches (CASE, COALESCE) get a numeric
            # common type;
            # a Distributed table inside a join or IN is read once and sent to all shards
            # (GLOBAL), which is correct whatever the sharding keys of the tables are
            cat > /etc/clickhouse-server/users.d/bexhoma.xml <<EOF
            <clickhouse>
              <profiles>
                <default>
                  <join_use_nulls>1</join_use_nulls>
                  <union_default_mode>DISTINCT</union_default_mode>
                  <cast_keep_nullable>1</cast_keep_nullable>
                  <allow_lossy_numeric_supertype>1</allow_lossy_numeric_supertype>
                  <distributed_product_mode>global</distributed_product_mode>
                </default>
              </profiles>
            </clickhouse>
            EOF
            exec /entrypoint.sh
        env:
        # keep user 'default' without password and with network access (clients and
        # shard-to-shard queries); without this the entrypoint restricts 'default' to localhost
        - {name: CLICKHOUSE_SKIP_USER_SETUP, value: '1'}
        ports:
        - {containerPort: 8123, name: http}
        - {containerPort: 9000, name: native}
        - {containerPort: 9181, name: keeper}
        - {containerPort: 9363, name: metrics}
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 1000m, memory: 1Gi}
        # instead of privileged: thread priorities (os_thread_priority), mlock of the binary,
        # per-query OS metrics from taskstats
        securityContext:
          capabilities:
            add: ["SYS_NICE", "IPC_LOCK", "NET_ADMIN"]
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - {mountPath: /data, name: benchmark-data-volume}
        - {mountPath: /var/lib/clickhouse, name: benchmark-storage-volume}
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.47.0
        args: ["--port", "9300", "--storage_duration", "20m0s", "--docker_only", "true", "--disable_metrics", "disk,network,tcp,advtcp,udp,sched,process,hugetlb", "--application_metrics_count_limit", "30", "--housekeeping_interval", "5s"]
        ports:
        - containerPort: 9300
          #hostPort: 9300
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 150m
            memory: 200Mi
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs
          readOnly: true
        - name: var-run
          mountPath: /var/run
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: docker
          mountPath: /var/lib/docker
          readOnly: true
        - name: disk
          mountPath: /dev/disk
          readOnly: true
      volumes:
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: bexhoma-data}
      - name: benchmark-storage-volume
        persistentVolumeClaim: {claimName: bexhoma-storage}
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker
      - name: disk
        hostPath:
          path: /dev/disk
---
apiVersion: v1
kind: Service
metadata:
  name: bexhoma-worker
  labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
spec:
  selector:
    {app: bexhoma, component: worker, configuration: default, experiment: default}
  clusterIP: None
  # shards resolve each other (remote_servers) before they are ready
  publishNotReadyAddresses: true
  ports:
  - {port: 9000, protocol: TCP, name: port-dbms, targetPort: 9000}
  - {port: 8123, protocol: TCP, name: port-sut-http, targetPort: 8123}
  - {port: 9300, protocol: TCP, name: port-monitoring, targetPort: 9300}
  - {port: 9363, protocol: TCP, name: port-monitoring-application, targetPort: 9363}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bexhoma-worker
  labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
spec:
  selector:
    matchLabels:
      {app: bexhoma, component: worker, configuration: default, experiment: default}
  serviceName: bexhoma-workers
  replicas: 3
  podManagementPolicy: Parallel
  template:
    metadata:
      labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      terminationGracePeriodSeconds: 180
      containers:
      - name: dbms
        image: clickhouse/clickhouse-server:26.8.34.13 # LTS
        # same cluster definition as the coordinator, Keeper of the coordinator, macros of this shard
        command:
          - bash
          - -ec
          - |
            ulimit -S -n "$(ulimit -H -n)" || true
            shards=""
            for host in $BEXHOMA_WORKER_LIST_SPACE; do
              shards="$shards<shard><replica><host>${host%%:*}</host><port>9000</port></replica></shard>"
            done
            cat > /etc/clickhouse-server/config.d/bexhoma-cluster.xml <<EOF
            <clickhouse>
              <remote_servers>
                <bexhoma>$shards</bexhoma>
              </remote_servers>
              <zookeeper>
                <node><host>${BEXHOMA_SUT_NAME}</host><port>9181</port></node>
              </zookeeper>
              <macros>
                <cluster>bexhoma</cluster>
                <shard>${HOSTNAME##*-}</shard>
                <replica>${HOSTNAME}</replica>
              </macros>
              <prometheus>
                <port>9363</port>
                <endpoint>/metrics</endpoint>
                <metrics>true</metrics>
                <events>true</events>
                <asynchronous_metrics>true</asynchronous_metrics>
              </prometheus>
            </clickhouse>
            EOF
            cat /etc/clickhouse-server/config.d/bexhoma-cluster.xml
            cat > /etc/clickhouse-server/users.d/bexhoma.xml <<EOF
            <clickhouse>
              <profiles>
                <default>
                  <join_use_nulls>1</join_use_nulls>
                  <union_default_mode>DISTINCT</union_default_mode>
                  <cast_keep_nullable>1</cast_keep_nullable>
                  <allow_lossy_numeric_supertype>1</allow_lossy_numeric_supertype>
                </default>
              </profiles>
            </clickhouse>
            EOF
            # the server resolves the names in remote_servers at start: wait until the headless
            # service publishes this pod
            self="${HOSTNAME}.${BEXHOMA_WORKER_SERVICE}"
            for i in $(seq 1 60); do
              getent hosts "$self" > /dev/null && break
              echo "waiting for DNS of $self"
              sleep 2
            done
            exec /entrypoint.sh
        env:
        - {name: CLICKHOUSE_SKIP_USER_SETUP, value: '1'}
        ports:
        - {containerPort: 8123, name: http}
        - {containerPort: 9000, name: native}
        - {containerPort: 9363, name: metrics}
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 1000m, memory: 1Gi}
        securityContext:
          capabilities:
            add: ["SYS_NICE", "IPC_LOCK", "NET_ADMIN"]
        # ready = has a session with the coordinator's Keeper, so it takes part in ON CLUSTER
        # statements; bexhoma runs the init scripts only after all workers are ready
        readinessProbe:
          exec:
            command: ["clickhouse-client", "--query", "SELECT count() FROM system.zookeeper WHERE path = '/'"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: bxw
          mountPath: /var/lib/clickhouse
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.47.0
        args: ["--port", "9300", "--storage_duration", "20m0s", "--docker_only", "true", "--disable_metrics", "disk,network,tcp,advtcp,udp,sched,process,hugetlb", "--application_metrics_count_limit", "30", "--housekeeping_interval", "5s"]
        ports:
        - containerPort: 9300
          #hostPort: 9300
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 150m
            memory: 200Mi
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs
          readOnly: true
        - name: var-run
          mountPath: /var/run
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: docker
          mountPath: /var/lib/docker
          readOnly: true
        - name: disk
          mountPath: /dev/disk
          readOnly: true
      volumes:
      - name: bxw
        persistentVolumeClaim: {claimName: bxw}
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker
      - name: disk
        hostPath:
          path: /dev/disk
  volumeClaimTemplates:
  - metadata:
      name: bxw
      labels: {app: bexhoma, component: worker, configuration: default, experiment: default}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
      storageClassName: shared
