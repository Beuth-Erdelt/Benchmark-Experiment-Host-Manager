apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: shared
---
apiVersion: v1
kind: Service
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-service
spec:
  ports:
  - {port: 9091, protocol: TCP, name: port-dbms, targetPort: 3306}
  - {port: 9300, protocol: TCP, name: port-monitoring, targetPort: 9300}
  - {port: 9500, protocol: TCP, name: port-monitoring-application, targetPort: 9104}
  selector: {app: bexhoma, component: sut, configuration: default, experiment: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  annotations: {bexhoma/arg-style: flag}   # --set writes --key=value elements
  name: bexhoma-deployment-mysql
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  template:
    metadata:
      labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      terminationGracePeriodSeconds: 180
      containers:
      - name: dbms
        image: mysql:9.7.2                           # LTS
        #image: mysql:8.4.0                           # LTS, default InnoDB settings have changed, import sometimes really slow
        args:
          - "--max_connections=1500"
          - "--local-infile=1"
          # --- Authentication ---
          # 9.x has no mysql_native_password; caching_sha2_password needs TLS or the RSA key on first login.
          # bexhoma adds --ssl-ca/--ssl-cert/--ssl-key and the Secret volume when TLS is configured.
          #- "--innodb_log_file_size=2GB"          # Deprecated in 8.0.30
          - "--innodb-redo-log-capacity=32GB"
          - "--innodb-io-capacity=400"             # Tuned for NVMe SSDs vs. remote deistributed Ceph
          - "--innodb-io-capacity_max=2000"         # Twice the capacity
          # --- I/O Threading ---
          - "--innodb-read-io-threads=8"           # Max threads to handle read I/O
          - "--innodb-write-io-threads=8"          # Max threads for write I/O
          # --- Async I/O (for CephFS) ---
          - "--innodb-use-native-aio=0"            # Disable native AIO (improves CephFS compatibility)
          # --- Buffer Pool (Main memory cache) ---
          # 8G fits the default -rr 16Gi (the namespace sets limit = request); larger pods set it per run,
          # e.g. --set ...container[dbms].innodb_buffer_pool_size=32G. Default chunk size (128M) x 8
          # instances: MySQL rounds a --set value up to the next multiple of 1G only.
          - "--innodb-buffer-pool-size=8G"
          - "--innodb-buffer-pool-instances=8"
          # --- I/O Capacity (for background flushing) ---
          - "--innodb-flush-method=O_DIRECT"
          - "--innodb-flush-neighbors=0"
          #- "--innodb-io-capacity=300"            # Lowered for CephFS latency
          #- "--innodb-io-capacity-max=1000"       # Burst capacity still reasonably high
          # --- Redo Log ---
          #- "--innodb-log-buffer-size=16G"        # Buffer before flushing to disk
          #- "--innodb-redo-log-capacity=32G"      # Redo log capacity for large write bursts
          # --- Transaction Commit Behavior ---
          # --- Durability: DBMS defaults (crash-safe); relax per run with --set, e.g. --set ...container[dbms].innodb_flush_log_at_trx_commit=2
          - "--skip-log-bin"                        # Disable binary logging; reduces disk usage by ~50% during load
          #- "--sync-binlog=0"                     # No fsync per transaction (OLAP-friendly)
          # --- Temporary Tables ---
          #- "--tmp-table-size=1G"                 # Prevent temp table disk usage
          #- "--max-heap-table-size=1G"            # For user-created MEMORY tables
          # --- Change Buffer ---
          - "--innodb-change-buffer-max-size=50"   # % of buffer pool for insert/update/delete buffering
          # --- DDL and Read Parallelism ---
          #- "--innodb-parallel-read-threads=64"   # For multi-threaded table scans (OLAP)
          #- "--innodb-ddl-threads=32"             # Parallel DDL ops (index creation, etc.)
          #- "--innodb-ddl-buffer-size=256M"       # DDL metadata operations memory
          - "--tmpdir=/mysqltmp"
          # --- TLS (Secret created by bexhoma; volume and these args are removed when the config has no 'tls') ---
          - "--ssl-ca=/etc/mysql/certs/ca.pem"
          - "--ssl-cert=/etc/mysql/certs/server-cert.pem"
          - "--ssl-key=/etc/mysql/certs/server-key.pem"
        env:
          - {name: MYSQL_ALLOW_EMPTY_PASSWORD, value: 'yes'}
          - {name: MYSQL_ROOT_HOST, value: '%'}
        lifecycle:
          preStop:
            exec:
              #command: ["mysqladmin shutdown"] # no such file or directory: unknown
              command: ["/bin/sh", "-c", "mysqladmin shutdown"]
              #command: ["/bin/sh", "-c", "mysqladmin shutdown -uroot -proot"]
              #command: ["/bin/sh", "-c", "mysqladmin shutdown -uroot"]
        readinessProbe: #mysqladmin ping > /dev/null 2>&1 && echo "MySQL server is running." || echo "MySQL server is not running."
          exec:
            command: [
              "/bin/sh", 
              "-c", 
              "if mysqladmin ping | grep -q 'mysqld is alive'; then echo 'MySQL is up'; exit 0; else echo 'MySQL is down'; exit 1; fi"
            ]
            #command: ["/bin/sh", "-c", "if mysqladmin ping | grep -q 'mysqld is alive'; then exit 0; else exit 1; fi"]
            #command: ["/bin/sh", "-c", "mysqladmin ping > /dev/null 2>&1"]
            #command: ["mysqladmin ping > /dev/null 2>&1"] # no such file or directory: unknown
            #command: ["/bin/sh", "-c", "'if mysqladmin ping > /dev/null 2>&1; then exit 0; else exit 1; fi'"]
            #command: ["/bin/sh", "-c", "mysqladmin ping > /dev/null 2>&1"]
            #command:
            #- mysqladmin
            #- ping
            #- > /dev/null 2>&1
          initialDelaySeconds: 60
          timeoutSeconds: 10
          periodSeconds: 60
          successThreshold: 3
        ports:
        - {containerPort: 3306}
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 1000m, memory: 1Gi}
          #, ephemeral-storage: "1536Gi"}
        volumeMounts:
        - {mountPath: /data, name: benchmark-data-volume}
        - {mountPath: /var/lib/mysql, name: benchmark-storage-volume}
        - {mountPath: /mysqltmp, name: mysqltmp}
        - {mountPath: /etc/mysql/certs, name: bexhoma-tls, readOnly: true}
      - name: monitor-application
        image: prom/mysqld-exporter:v0.20.0
        args:
          - "--mysqld.address=localhost:3306"
          - "--mysqld.username=root"
        env:
          - {name: MYSQLD_EXPORTER_PASSWORD, value: 'root'}
        ports:
          - containerPort: 9104
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: bexhoma-data}
      - name: benchmark-storage-volume
        persistentVolumeClaim: {claimName: bexhoma-storage}
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker
      - name: disk
        hostPath:
          path: /dev/disk
      - name: mysqltmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: bexhoma-tls
        secret:
          secretName: bexhoma-tls
