apiVersion: batch/v1
kind: Job
metadata:
  labels: {app: bexhoma, component: loading, configuration: default, experiment: default, client: default}
  name: bexhoma-sensor
spec:
  backoffLimit: 4
  completions: 4
  parallelism: 4
  template:
    metadata:
      labels: {app: bexhoma, component: loading, configuration: default, experiment: default, client: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: dockerhub
      nodeSelector: 
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      containers:
      - name: sensor
        image: bexhoma/generator_hammerdb:BEXHOMA_PACKAGE_VERSION
        imagePullPolicy: Always
        env:
        - {name: BEXHOMA_HOST, value: 'bexhoma-sut-timescaledb-aws-1658676533'}
        - {name: BEXHOMA_PORT, value: '9091'}
        - {name: BEXHOMA_CONNECTION, value: 'monetdb'}
        - {name: BEXHOMA_EXPERIMENT, value: '1234'}
        - {name: PARALLEL, value: '1'}
        - {name: CHILD, value: '1'}
        - {name: SF, value: '1'}
        - {name: RNGSEED, value: '123'}
        - {name: HAMMERDB_TYPE, value: 'mysql'}
        resources:
          # measured peaks are far below; without a request the cluster default reserves 16Gi
          requests: {memory: 1Gi}
          limits: {memory: 16Gi}
          #limits: {cpu: 100m}
          #, memory: 16Gi}
          #requests: {cpu: 4000m}
          #, memory: 16Gi}
        #securityContext:
        #  privileged: true
        volumeMounts:
        - name: datadir
          mountPath: "/tmp/tpcc/"
        # CA of the SUT's TLS Secret (MySQL 9); bexhoma removes it when the SUT has none
        - name: bexhoma-tls
          mountPath: /etc/mysql/certs
          readOnly: true
      restartPolicy: Never
      volumes:
      - name: datadir
        emptyDir: {}
      - name: bexhoma-tls
        secret:
          secretName: bexhoma-tls
          items:
          - {key: ca.pem, path: ca-cert.pem}
