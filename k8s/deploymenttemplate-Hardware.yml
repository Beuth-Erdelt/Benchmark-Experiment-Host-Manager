apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  name: bexhoma-deployment-hardware
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma, component: sut, configuration: default, experiment: default}
  template:
    metadata:
      labels: {app: bexhoma, component: sut, configuration: default, experiment: default}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - {name: dockerhub}
      nodeSelector:
      tolerations:
      #- key: "nvidia.com/gpu"
      #  effect: "NoSchedule"
      initContainers:
        # world-writable so fio/sysbench (run over SSH as the "bench" user) can
        # write regardless of what uid that ends up being on this storage class.
        - name: fix-permissions
          image: busybox:stable
          command:
            - sh
            - -c
            - |
                mkdir -p /database
                chmod -v -R 777 /database
          volumeMounts:
          - {mountPath: /database, name: benchmark-storage-volume}
      containers:
      - name: dbms
        image: bexhoma/sut_hardware:BEXHOMA_PACKAGE_VERSION
        imagePullPolicy: Always
        env:
        # static defaults, matching the ENV declared in
        # images/hardware/sut/Dockerfile; not swept per-experiment
        - {name: SOCKPERF_NUM_SERVERS, value: "16"}
        - {name: SOCKPERF_BASE_PORT, value: "20000"}
        - {name: NETPERF_CONTROL_PORT, value: "12865"}
        - {name: NETPERF_DATA_BASE_PORT, value: "30000"}
        - {name: NETPERF_DATA_NUM_PORTS, value: "64"}
        ports:
        - {containerPort: 22, name: ssh}
        - {containerPort: 20000, name: port-sut-0-tcp, protocol: TCP}
        - {containerPort: 20000, name: port-sut-0-udp, protocol: UDP}
        - {containerPort: 20001, name: port-sut-1-tcp, protocol: TCP}
        - {containerPort: 20001, name: port-sut-1-udp, protocol: UDP}
        - {containerPort: 20002, name: port-sut-2-tcp, protocol: TCP}
        - {containerPort: 20002, name: port-sut-2-udp, protocol: UDP}
