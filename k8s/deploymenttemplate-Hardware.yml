  # netperf control port (single netserver instance, forks per connection) plus its
  # fixed data-port pool (NETPERF_DATA_BASE_PORT..+NETPERF_DATA_NUM_PORTS-1, see
  # images/hardware/sut/Dockerfile); run_netperf.sh pins each concurrent client
  # instance's data connection to one of these via netperf's "-P local,remote" option,
  # since only explicitly declared Service ports are forwarded.
  # Port *names* below are unrelated to the actual port numbers: k8s caps port names
  # at 15 chars, so they continue sockperf's "port-sut-<N>-tcp/udp" scheme starting at
