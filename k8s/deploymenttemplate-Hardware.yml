        - {containerPort: 20010, name: port-sut-10-tcp, protocol: TCP}
        - {containerPort: 20010, name: port-sut-10-udp, protocol: UDP}
        - {containerPort: 20011, name: port-sut-11-tcp, protocol: TCP}
        - {containerPort: 20011, name: port-sut-11-udp, protocol: UDP}
        - {containerPort: 20012, name: port-sut-12-tcp, protocol: TCP}
