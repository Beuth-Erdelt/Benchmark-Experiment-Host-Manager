apiVersion: v1
kind: Service
metadata:
  labels: {app: bexhoma}
  name: bexhoma-service
spec:
  ports:
  - {port: 9091, protocol: TCP, name: port-dbms, targetPort: 5432}
  selector: {app: bexhoma}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app: bexhoma}
  name: bexhoma-deployment-postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: bexhoma}
  template:
    metadata:
      labels: {app: bexhoma}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {cpu: epyc-7542}
      containers:
      - name: dbms
        image: postgres:11.4
        ports:
        - {containerPort: 5432}
        resources:
          limits: {cpu: 16000m, memory: 128Gi}
          requests: {cpu: 16000m, memory: 128Gi}
        volumeMounts:
        - {mountPath: /data, name: benchmark-data-volume}
        - {mountPath: /dev/shm, name: dshm}
      volumes:
      - name: benchmark-data-volume
        persistentVolumeClaim: {claimName: vol-benchmarking}
      - hostPath:
          path: /
        name: rootfs
      - hostPath:
          path: /var/run
        name: var-run
      - hostPath:
          path: /sys
        name: sys
      - hostPath:
          path: /var/lib/docker
        name: docker
      - hostPath:
          path: /dev/disk
        name: disk
      - name: proc
        hostPath:
          path: /proc
      - emptyDir:
          medium: Memory
        name: dshm
